name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  HELM_CHART: deploy/helm/hf-csi-driver

jobs:
  release:
    name: Create Github release
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v7

      - name: Release
        id: release
        uses: huggingface/semver-release-action@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-22.04
    needs: release
    if: |
      always() &&
      (needs.release.result == 'success' || github.event_name == 'push')
    steps:
      # Normalize Docker repository name to lowercase
      - name: Lowercase image name
        id: format
        run: |
          image="ghcr.io/${{ github.repository }}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
          else
            tag="${{ needs.release.outputs.tag }}"
            version="${{ needs.release.outputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.format.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.format.outputs.image }}:latest

  helm:
    name: Publish Helm Chart
    runs-on: ubuntu-22.04
    needs: [release, docker]
    if: |
      always() &&
      needs.docker.result == 'success' &&
      (needs.release.result == 'success' || github.event_name == 'push')
    steps:
      # Normalize Helm registry owner to lowercase
      - name: Lowercase owner name
        id: format
        run: |
          owner="${{ github.repository_owner }}"
          echo "owner=${owner,,}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
          else
            tag="${{ needs.release.outputs.tag }}"
            version="${{ needs.release.outputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Fetch latest hf-mount release tag
        id: hfmount
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api /repos/huggingface/hf-mount/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Substitute placeholders
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
          HFMOUNT_TAG: ${{ steps.hfmount.outputs.tag }}
        run: |
          sed -i "s/0.0.0-latest/${VERSION}/g" ${HELM_CHART}/Chart.yaml
          yq -i ".image.tag = \"${TAG}\"" ${HELM_CHART}/values.yaml
          yq -i ".webhook.image.tag = \"${TAG}\"" ${HELM_CHART}/values.yaml
          yq -i ".hfMount.image.tag = \"${HFMOUNT_TAG}\"" ${HELM_CHART}/values.yaml

      - uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          helm package ${HELM_CHART} --version ${{ steps.vars.outputs.version }} --app-version ${{ steps.vars.outputs.version }}
          helm push hf-csi-driver-${{ steps.vars.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ steps.format.outputs.owner }}/charts
